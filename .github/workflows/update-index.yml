name: Update MCP Repo Index

on:
  schedule:
    - cron: "0 6 * * *" # Runs daily at 6 AM UTC
  workflow_dispatch: # Manual trigger option

concurrency:
  group: update-mcp-repo-index
  cancel-in-progress: false

jobs:
  update-index:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: find-awesome-mcp-servers/package-lock.json

      - name: Install dependencies
        working-directory: find-awesome-mcp-servers
        run: npm ci

      - name: Validate generator
        working-directory: find-awesome-mcp-servers
        run: npm run check

      - name: Run script
        working-directory: find-awesome-mcp-servers
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MIN_REPO_COUNT: "50"
        run: npm run find

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md AWESOME-MCP-REPOS.md TOP-TENS.md ACTIVITY.md INDEX-COVERAGE.md data/indexes.json data/discovery-audit.json data/index-links.json
          git diff --staged --quiet || git commit -m "chore: update MCP repo index"
          git push
