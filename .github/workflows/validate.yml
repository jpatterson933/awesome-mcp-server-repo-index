name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  generator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: find-awesome-mcp-servers
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: find-awesome-mcp-servers/package-lock.json

      - run: npm ci
      - run: npm run check
